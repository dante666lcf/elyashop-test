name: Build catalog data

on:
  push:
    branches: [main]
    paths:
      - 'catalog_ru.json'
      - 'build_catalog.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build lightweight catalog
        run: python build_catalog.py catalog_ru.json

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/chunks
          if git diff --cached --quiet; then
            echo "Catalog data already up to date"
            exit 0
          fi
          git commit -m "Build catalog data from catalog_ru.json"
          git push
